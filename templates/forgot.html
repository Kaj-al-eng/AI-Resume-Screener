<!DOCTYPE html>
<html>
<head>

<title>Forgot Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='login.css') }}">

</head>

<body>

<div class="container">

<h1>Reset Password</h1>

<p>Enter your email to receive OTP</p>

<form action="/forgot" method="POST">

<div class="input-box">

<label>Email</label>

<input type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<button type="submit"
class="btn">

Send OTP

</button>

</form>

<div class="links">

<a href="/login">

Back to Login

</a>

</div>

</div>

</body>
</html>
